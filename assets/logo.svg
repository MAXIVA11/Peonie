<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Peonie logo">
  <defs>
    <radialGradient id="petal" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#ffe3f1"/>
      <stop offset="45%" stop-color="#ff9ec7"/>
      <stop offset="100%" stop-color="#e5468f"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="60%" stop-color="#ffcf6b"/>
      <stop offset="100%" stop-color="#e59a2b"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9ec7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- cyber ring -->
  <circle cx="120" cy="120" r="104" fill="#120a1e"/>
  <circle cx="120" cy="120" r="104" fill="none" stroke="url(#ring)" stroke-width="3" stroke-dasharray="6 10" opacity="0.8"/>
  <circle cx="120" cy="120" r="92" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.35"/>

  <!-- circuit nodes -->
  <g stroke="#ff9ec7" stroke-width="1.4" opacity="0.5" fill="#ff9ec7">
    <path d="M120 16 V40 M120 200 V224 M16 120 H40 M200 120 H224" />
    <circle cx="120" cy="16" r="3"/><circle cx="120" cy="224" r="3"/><circle cx="16" cy="120" r="3"/><circle cx="224" cy="120" r="3"/>
  </g>

  <!-- peony: layered petals -->
  <g transform="translate(120 122)">
    <g fill="url(#petal)" filter="url(#soft)">
      <g>
        <ellipse cx="0" cy="-54" rx="26" ry="40"/>
        <ellipse cx="0" cy="-54" rx="26" ry="40" transform="rotate(60)"/>
        <ellipse cx="0" cy="-54" rx="26" ry="40" transform="rotate(120)"/>
        <ellipse cx="0" cy="-54" rx="26" ry="40" transform="rotate(180)"/>
        <ellipse cx="0" cy="-54" rx="26" ry="40" transform="rotate(240)"/>
        <ellipse cx="0" cy="-54" rx="26" ry="40" transform="rotate(300)"/>
      </g>
    </g>
    <g fill="url(#petal)" opacity="0.96">
      <g transform="rotate(30)">
        <ellipse cx="0" cy="-36" rx="20" ry="30"/>
        <ellipse cx="0" cy="-36" rx="20" ry="30" transform="rotate(72)"/>
        <ellipse cx="0" cy="-36" rx="20" ry="30" transform="rotate(144)"/>
        <ellipse cx="0" cy="-36" rx="20" ry="30" transform="rotate(216)"/>
        <ellipse cx="0" cy="-36" rx="20" ry="30" transform="rotate(288)"/>
      </g>
    </g>
    <circle cx="0" cy="0" r="20" fill="url(#core)"/>
    <g fill="#e5468f" opacity="0.85">
      <circle cx="0" cy="-9" r="2.2"/><circle cx="8" cy="-3" r="2.2"/><circle cx="5" cy="7" r="2.2"/>
      <circle cx="-5" cy="7" r="2.2"/><circle cx="-8" cy="-3" r="2.2"/><circle cx="0" cy="0" r="2.2"/>
    </g>
  </g>
</svg>
